workflows:
  ios-build:
    name: BearCave iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    
    # TRIGGER: Build automatically on push to main
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    
    environment:
      ios_signing:
        provisioning_profiles:
          - App Store Profile
        certificates:
          - Distribution Certificate
      
      groups:
        - ios_config  # Contains APP_STORE_APP_ID
      
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      
      node: 20
      xcode: latest
      cocoapods: default
    
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      
      - name: Build web assets
        script: |
          npm run build
      
      - name: Sync Capacitor to iOS
        script: |
          npx cap sync ios
      
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        # submit_to_app_store: true  # Uncomment when ready for production release

  android-build:
    name: BearCave Android Build
    max_build_duration: 120
    instance_type: linux_x2
    
    # TRIGGER: Build automatically on push to main (same as iOS)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    
    environment:
      android_signing:
        - bearcave_keystore  # Reference name from Codemagic UI
      
      vars:
        PACKAGE_NAME: "com.deepdenebears.bearcave"
      
      java: 21
      node: 20
    
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      
      - name: Build web assets
        script: |
          npm run build
      
      - name: Sync Capacitor to Android
        script: |
          npx cap sync android
      
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      
      - name: Build Android App Bundle
        script: |
          cd android
          
          # Use build number from Codemagic (auto-increments each build)
          BUILD_NUMBER=${BUILD_NUMBER:-1}
          
          echo "Building Android App Bundle with versionCode: $BUILD_NUMBER"
          
          # Build App Bundle
          ./gradlew bundleRelease \
            -PversionCode=$BUILD_NUMBER \
            -PversionName=1.0.$BUILD_NUMBER
    
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    
    publishing:
      email:
        recipients:
          - cmolloy737@gmail.com
        notify:
          success: true
          failure: true
      
      # Publishing to Google Play (uncomment when service account is configured)
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: false
